services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: savebite
      POSTGRES_USER: savebite
      POSTGRES_PASSWORD: savebite
    ports:
      - "5432:5432"
    volumes:
      - savebite-postgres:/var/lib/postgresql/data
      - ./init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savebite -d savebite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - savebite-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  savebite-postgres:
  savebite-redis: